# `uv`, not `pip`: the pip ecosystem reads pyproject.toml but not uv.lock, so its PRs
# raised the declared minimum while the lockfile kept installing the old version.
#
# Weekly and grouped: one PR per group is reviewed; a stream of single-package PRs
# is not. Major versions stay out of the groups and arrive one by one.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev:
        dependency-type: development
        update-types:
          - minor
          - patch
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      # pip-audit checks the whole tree: two separate security PRs would each fail on
      # the other's package, so they travel together.
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Base image of the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
