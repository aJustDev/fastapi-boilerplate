# Known CVEs in the whole dependency tree and in the image, every day. The CI of a PR only
# warns about dependencies; this workflow fails (and GitHub emails it) until an update of a
# dependency or of the base image fixes it.
name: Audit

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Dependency CVE audit
        run: uv run pip-audit --skip-editable

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build -t app:audit .

      # Operating system packages of the base image and the Python packages in it. Only
      # what has a fix: the rest cannot be acted on. The fix is a newer base image digest
      # in the Dockerfile (Dependabot proposes it).
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app:audit
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
