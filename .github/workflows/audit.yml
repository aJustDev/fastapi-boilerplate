# Known CVEs in the whole dependency tree, every day. The CI of a PR only warns; this
# workflow fails (and GitHub emails it) until a dependency update fixes it.
name: Audit

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen

      - name: Dependency CVE audit
        run: uv run pip-audit --skip-editable
