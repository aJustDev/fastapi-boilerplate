name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here writes to the repository: the token only reads it.
permissions:
  contents: read

# A new push to the same branch cancels the run that is now stale.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Lockfile up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check app/ tests/ migrations/ scripts/ main.py docs/img/

      - name: Ruff format check
        run: uv run ruff format --check app/ tests/ migrations/ scripts/ main.py docs/img/

      - name: Mypy
        run: uv run mypy app/ main.py

      - name: Import contracts
        run: uv run lint-imports

      # Two branches whose migrations share a parent pass separately and leave two heads
      # once merged; upgrade would then refuse to run.
      - name: Single Alembic head
        run: |
          n="$(uv run alembic heads | grep -c '(head)')"
          if [ "$n" != "1" ]; then
            uv run alembic heads
            echo "::error::$n Alembic heads; merge the revisions"
            exit 1
          fi

      # The SVGs in docs/img are generated: an edited script whose figures were not
      # regenerated, or a hand-edited SVG, shows up here.
      - name: Diagrams up to date
        run: |
          for f in docs/img/[!_]*.py; do uv run python "$f" > /dev/null; done
          if [ -n "$(git status --porcelain -- docs/img)" ]; then
            git status --porcelain -- docs/img
            echo "::error::docs/img is out of date; run the generators and commit the SVGs"
            exit 1
          fi

      # Warning only: a new CVE in an unrelated package must not block every open PR,
      # including the Dependabot one that fixes it. The daily audit workflow is the
      # one that fails.
      - name: Dependency CVE audit
        continue-on-error: true
        run: uv run pip-audit --skip-editable

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # A hung testcontainer would otherwise bill until the 360 min default.
    timeout-minutes: 15
    env:
      # Same time zone as the image, so naive datetimes mean the same in tests and prod.
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests (unit, functional and integration)
        run: uv run pytest --cov=app --cov-report=term-missing

  image:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # hadolint reads the Dockerfile; only a build shows that it works.
      - name: Build the image
        run: docker build -t app:ci .

      # As shipped the image is ENVIRONMENT=production with the placeholder key: it has to
      # refuse to start, not serve requests signed with a key everybody knows.
      - name: The image refuses to start unconfigured
        run: |
          if docker run --rm app:ci 2> startup.log; then
            echo "::error::the image started without a SECRET_KEY"
            exit 1
          fi
          grep -q "SECRET_KEY must be changed" startup.log

      # With the settings production requires, and no database: it starts, and its own
      # HEALTHCHECK passes under an explicit ALLOWED_HOSTS.
      - name: The image starts and is healthy with production settings
        run: |
          docker run -d --name app \
            -e SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" \
            -e 'ALLOWED_HOSTS=["api.example.com"]' \
            -e 'ALLOWED_ORIGINS=[]' \
            -e FORWARDED_ALLOW_IPS= \
            app:ci
          for _ in $(seq 1 40); do
            status="$(docker inspect --format '{{.State.Health.Status}}' app)"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          docker logs app
          echo "::error::the container did not become healthy (last status: $status)"
          exit 1
