<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -3 766 324" width="766" height="324" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif">
<g class="workshops-f1">
<rect x="40" y="0" width="320" height="46" rx="8" fill="#e8f0f8" stroke="#1f4e79" stroke-width="1.4"/>
<text x="200.0" y="19" text-anchor="middle"><tspan font-weight="bold" fill="#1f4e79" font-size="12.5">1 - Lock the workshop row</tspan></text>
<text x="200.0" y="36" text-anchor="middle"><tspan fill="#6b7785" font-size="11">SELECT ... FOR UPDATE, until the commit</tspan></text>
<polyline points="360.0,23.0 434.0,23.0" fill="none" stroke="#6b7785" stroke-width="1.6" stroke-dasharray="4 3"/>
<polygon points="440,23.0 432.9,26.8 432.9,19.2" fill="#6b7785"/>
<rect x="440" y="0" width="320" height="46" rx="6" fill="#f2f5f9" stroke="#6b7785" stroke-width="1.2"/>
<text x="452" y="19" text-anchor="start"><tspan fill="#222" font-size="11.5">Another request about this workshop waits here.</tspan></text>
<text x="452" y="33" text-anchor="start"><tspan fill="#222" font-size="11.5">Requests about other workshops are not held up.</tspan></text>
<polyline points="200.0,46.0 200.0,60.0" fill="none" stroke="#6b7785" stroke-width="1.6"/>
<polygon points="200.0,66 196.2,58.9 203.8,58.9" fill="#6b7785"/>
<rect x="40" y="66" width="320" height="46" rx="22" fill="#fff3dc" stroke="#a35f00" stroke-width="1.4"/>
<text x="200.0" y="94" text-anchor="middle"><tspan font-weight="bold" fill="#a35f00" font-size="12.5">2 - Is this user already enrolled?</tspan></text>
<polyline points="360.0,89.0 434.0,89.0" fill="none" stroke="#2e7d32" stroke-width="1.6"/>
<polygon points="440,89.0 432.9,92.8 432.9,85.2" fill="#2e7d32"/>
<text x="400.0" y="83.0" text-anchor="middle"><tspan font-weight="bold" fill="#2e7d32" font-size="11">yes</tspan></text>
<rect x="440" y="66" width="320" height="46" rx="6" fill="#e8f3e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="452" y="93" text-anchor="start"><tspan fill="#222" font-size="11.5">Answer 200 with the enrollment that exists.</tspan></text>
<polyline points="200.0,112.0 200.0,126.0" fill="none" stroke="#6b7785" stroke-width="1.6"/>
<polygon points="200.0,132 196.2,124.9 203.8,124.9" fill="#6b7785"/>
<text x="208.0" y="126" text-anchor="start"><tspan font-weight="bold" fill="#6b7785" font-size="11">no</tspan></text>
<rect x="40" y="132" width="320" height="46" rx="22" fill="#fff3dc" stroke="#a35f00" stroke-width="1.4"/>
<text x="200.0" y="160" text-anchor="middle"><tspan font-weight="bold" fill="#a35f00" font-size="12.5">3 - Is a seat free?</tspan></text>
<polyline points="360.0,155.0 434.0,155.0" fill="none" stroke="#6b7785" stroke-width="1.6"/>
<polygon points="440,155.0 432.9,158.8 432.9,151.2" fill="#6b7785"/>
<text x="400.0" y="149.0" text-anchor="middle"><tspan font-weight="bold" fill="#6b7785" font-size="11">no</tspan></text>
<rect x="440" y="132" width="320" height="46" rx="6" fill="#f2f5f9" stroke="#6b7785" stroke-width="1.2"/>
<text x="452" y="159" text-anchor="start"><tspan fill="#222" font-size="11.5">Store it as waitlisted, last in line. No event.</tspan></text>
<polyline points="200.0,178.0 200.0,192.0" fill="none" stroke="#6b7785" stroke-width="1.6"/>
<polygon points="200.0,198 196.2,190.9 203.8,190.9" fill="#6b7785"/>
<text x="208.0" y="192" text-anchor="start"><tspan font-weight="bold" fill="#6b7785" font-size="11">yes</tspan></text>
<rect x="40" y="198" width="320" height="46" rx="8" fill="#e8f3e9" stroke="#2e7d32" stroke-width="1.4"/>
<text x="200.0" y="217" text-anchor="middle"><tspan font-weight="bold" fill="#2e7d32" font-size="12.5">4 - Store it as confirmed, count the seat</tspan></text>
<text x="200.0" y="234" text-anchor="middle"><tspan fill="#6b7785" font-size="11">and the enrollment.confirmed event, in the same commit</tspan></text>
<rect x="0" y="266" width="760" height="52" rx="6" fill="#f2f5f9" stroke="#c9d3df" stroke-width="1"/>
<text x="14" y="289" text-anchor="start"><tspan fill="#222" font-size="12">Leaving takes the same lock: the enrollment is cancelled and, if it held a seat, the first person waiting is confirmed before</tspan></text>
<text x="14" y="305" text-anchor="start"><tspan fill="#222" font-size="12">anyone else can enrol.</tspan></text>
</g>
</svg>
