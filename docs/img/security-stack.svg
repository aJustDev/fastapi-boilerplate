<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -3 766 456" width="766" height="456" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif">
<g class="sec-f1">
<rect x="40" y="0" width="320" height="46" rx="8" fill="#e8f0f8" stroke="#1f4e79" stroke-width="1.4"/>
<text x="200.0" y="19" text-anchor="middle"><tspan font-weight="bold" fill="#1f4e79" font-size="12.5">1 - ProxyHeaders</tspan></text>
<text x="200.0" y="36" text-anchor="middle"><tspan fill="#6b7785" font-size="11">client IP and scheme from trusted proxies only</tspan></text>
<polyline points="200.0,46.0 200.0,60.0" fill="none" stroke="#6b7785" stroke-width="1.6"/>
<polygon points="200.0,66 196.2,58.9 203.8,58.9" fill="#6b7785"/>
<rect x="40" y="66" width="320" height="46" rx="22" fill="#fff3dc" stroke="#a35f00" stroke-width="1.4"/>
<text x="200.0" y="94" text-anchor="middle"><tspan font-weight="bold" fill="#a35f00" font-size="12.5">2 - TrustedHost: allowed Host?</tspan></text>
<polyline points="360.0,89.0 434.0,89.0" fill="none" stroke="#b03a2e" stroke-width="1.6"/>
<polygon points="440,89.0 432.9,92.8 432.9,85.2" fill="#b03a2e"/>
<text x="400.0" y="83.0" text-anchor="middle"><tspan font-weight="bold" fill="#b03a2e" font-size="11">no</tspan></text>
<rect x="440" y="66" width="320" height="46" rx="6" fill="#fbeaea" stroke="#b03a2e" stroke-width="1.2"/>
<text x="452" y="93" text-anchor="start"><tspan fill="#222" font-size="11.5">400 before any work is done.</tspan></text>
<polyline points="200.0,112.0 200.0,126.0" fill="none" stroke="#6b7785" stroke-width="1.6"/>
<polygon points="200.0,132 196.2,124.9 203.8,124.9" fill="#6b7785"/>
<text x="208.0" y="126" text-anchor="start"><tspan font-weight="bold" fill="#6b7785" font-size="11">yes</tspan></text>
<rect x="40" y="132" width="320" height="46" rx="8" fill="#e8f0f8" stroke="#1f4e79" stroke-width="1.4"/>
<text x="200.0" y="151" text-anchor="middle"><tspan font-weight="bold" fill="#1f4e79" font-size="12.5">3 - Metrics, request id, headers, CORS</tspan></text>
<text x="200.0" y="168" text-anchor="middle"><tspan fill="#6b7785" font-size="11">security headers are added on the way out</tspan></text>
<polyline points="200.0,178.0 200.0,192.0" fill="none" stroke="#6b7785" stroke-width="1.6"/>
<polygon points="200.0,198 196.2,190.9 203.8,190.9" fill="#6b7785"/>
<rect x="40" y="198" width="320" height="46" rx="22" fill="#fff3dc" stroke="#a35f00" stroke-width="1.4"/>
<text x="200.0" y="226" text-anchor="middle"><tspan font-weight="bold" fill="#a35f00" font-size="12.5">4 - Dependencies: valid token?</tspan></text>
<polyline points="360.0,221.0 434.0,221.0" fill="none" stroke="#b03a2e" stroke-width="1.6"/>
<polygon points="440,221.0 432.9,224.8 432.9,217.2" fill="#b03a2e"/>
<text x="400.0" y="215.0" text-anchor="middle"><tspan font-weight="bold" fill="#b03a2e" font-size="11">no</tspan></text>
<rect x="440" y="198" width="320" height="46" rx="6" fill="#fbeaea" stroke="#b03a2e" stroke-width="1.2"/>
<text x="452" y="225" text-anchor="start"><tspan fill="#222" font-size="11.5">401, unless the route is public.</tspan></text>
<polyline points="200.0,244.0 200.0,258.0" fill="none" stroke="#6b7785" stroke-width="1.6"/>
<polygon points="200.0,264 196.2,256.9 203.8,256.9" fill="#6b7785"/>
<text x="208.0" y="258" text-anchor="start"><tspan font-weight="bold" fill="#6b7785" font-size="11">yes</tspan></text>
<rect x="40" y="264" width="320" height="46" rx="22" fill="#fff3dc" stroke="#a35f00" stroke-width="1.4"/>
<text x="200.0" y="292" text-anchor="middle"><tspan font-weight="bold" fill="#a35f00" font-size="12.5">5 - Endpoint limit: under it?</tspan></text>
<polyline points="360.0,287.0 434.0,287.0" fill="none" stroke="#b03a2e" stroke-width="1.6"/>
<polygon points="440,287.0 432.9,290.8 432.9,283.2" fill="#b03a2e"/>
<text x="400.0" y="281.0" text-anchor="middle"><tspan font-weight="bold" fill="#b03a2e" font-size="11">no</tspan></text>
<rect x="440" y="264" width="320" height="46" rx="6" fill="#fbeaea" stroke="#b03a2e" stroke-width="1.2"/>
<text x="452" y="291" text-anchor="start"><tspan fill="#222" font-size="11.5">429 with Retry-After in seconds.</tspan></text>
<polyline points="200.0,310.0 200.0,324.0" fill="none" stroke="#6b7785" stroke-width="1.6"/>
<polygon points="200.0,330 196.2,322.9 203.8,322.9" fill="#6b7785"/>
<text x="208.0" y="324" text-anchor="start"><tspan font-weight="bold" fill="#6b7785" font-size="11">yes</tspan></text>
<rect x="40" y="330" width="320" height="46" rx="8" fill="#e8f3e9" stroke="#2e7d32" stroke-width="1.4"/>
<text x="200.0" y="349" text-anchor="middle"><tspan font-weight="bold" fill="#2e7d32" font-size="12.5">6 - The endpoint runs</tspan></text>
<text x="200.0" y="366" text-anchor="middle"><tspan fill="#6b7785" font-size="11">one use case</tspan></text>
<rect x="0" y="398" width="760" height="52" rx="6" fill="#f2f5f9" stroke="#c9d3df" stroke-width="1"/>
<text x="14" y="421" text-anchor="start"><tspan fill="#222" font-size="12">The proxy step comes first so the rate limit and the logs see the real client address. The limit is a decorator of each</tspan></text>
<text x="14" y="437" text-anchor="start"><tspan fill="#222" font-size="12">endpoint, so it is checked after the dependencies.</tspan></text>
</g>
</svg>
