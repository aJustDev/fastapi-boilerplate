<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -3 766 310" width="766" height="310" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif">
<g class="eb-f2">
<text x="306.0" y="20" text-anchor="middle"><tspan font-weight="bold" fill="#b03a2e" font-size="12">Before</tspan></text>
<text x="615.0" y="20" text-anchor="middle"><tspan font-weight="bold" fill="#2e7d32" font-size="12">Now</tspan></text>
<text x="0" y="58" text-anchor="start"><tspan font-weight="bold" fill="#222" font-size="13">Several workers</tspan></text>
<text x="0" y="75" text-anchor="start"><tspan fill="#6b7785" font-size="11.5">--workers N, replicas or a</tspan></text>
<text x="0" y="90" text-anchor="start"><tspan fill="#6b7785" font-size="11.5">rolling deploy</tspan></text>
<rect x="170" y="34" width="272" height="86" rx="8" fill="#fbeaea" stroke="#b03a2e" stroke-width="1.2"/>
<path d="M192 44 L204 65 H180 Z" fill="#b03a2e" stroke="#b03a2e" stroke-width="2" stroke-linejoin="round"/>
<path d="M192 51 V58 M192 61.5 V62" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
<text x="214" y="60" text-anchor="start"><tspan fill="#222" font-size="12">The whole batch was locked, but the</tspan></text>
<text x="214" y="75" text-anchor="start"><tspan fill="#222" font-size="12">first commit released it: another</tspan></text>
<text x="214" y="90" text-anchor="start"><tspan fill="#222" font-size="12">worker dispatched the same events</tspan></text>
<text x="214" y="105" text-anchor="start"><tspan fill="#222" font-size="12">again.</tspan></text>
<polyline points="446.0,77.0 460.0,77.0" fill="none" stroke="#2e7d32" stroke-width="2"/>
<polygon points="466,77.0 458.9,80.8 458.9,73.2" fill="#2e7d32"/>
<rect x="470" y="34" width="290" height="86" rx="8" fill="#e8f3e9" stroke="#2e7d32" stroke-width="1.2"/>
<circle cx="492" cy="56" r="12" fill="#2e7d32"/>
<path d="M486.5 56.5 l3.8 4 l7.5 -8.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="514" y="60" text-anchor="start"><tspan fill="#222" font-size="12">Each event is locked and committed on</tspan></text>
<text x="514" y="75" text-anchor="start"><tspan fill="#222" font-size="12">its own: a second worker always takes a</tspan></text>
<text x="514" y="90" text-anchor="start"><tspan fill="#222" font-size="12">different one.</tspan></text>
<text x="0" y="156" text-anchor="start"><tspan font-weight="bold" fill="#222" font-size="13">A NOTIFY arrives</tspan></text>
<text x="0" y="173" text-anchor="start"><tspan fill="#6b7785" font-size="11.5">right after a commit</tspan></text>
<rect x="170" y="132" width="272" height="80" rx="8" fill="#fbeaea" stroke="#b03a2e" stroke-width="1.2"/>
<path d="M192 142 L204 163 H180 Z" fill="#b03a2e" stroke="#b03a2e" stroke-width="2" stroke-linejoin="round"/>
<path d="M192 149 V156 M192 159.5 V160" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
<text x="214" y="158" text-anchor="start"><tspan fill="#222" font-size="12">It was ignored: the event waited for</tspan></text>
<text x="214" y="173" text-anchor="start"><tspan fill="#222" font-size="12">the next poll, up to 30 s.</tspan></text>
<polyline points="446.0,172.0 460.0,172.0" fill="none" stroke="#2e7d32" stroke-width="2"/>
<polygon points="466,172.0 458.9,175.8 458.9,168.2" fill="#2e7d32"/>
<rect x="470" y="132" width="290" height="80" rx="8" fill="#e8f3e9" stroke="#2e7d32" stroke-width="1.2"/>
<circle cx="492" cy="154" r="12" fill="#2e7d32"/>
<path d="M486.5 154.5 l3.8 4 l7.5 -8.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="514" y="158" text-anchor="start"><tspan fill="#222" font-size="12">It wakes the worker at once; the poll</tspan></text>
<text x="514" y="173" text-anchor="start"><tspan fill="#222" font-size="12">only covers notifications lost during a</tspan></text>
<text x="514" y="188" text-anchor="start"><tspan fill="#222" font-size="12">reconnect.</tspan></text>
<text x="0" y="248" text-anchor="start"><tspan font-weight="bold" fill="#222" font-size="13">No handler registered</tspan></text>
<text x="0" y="265" text-anchor="start"><tspan fill="#6b7785" font-size="11.5">typo in the event type,</tspan></text>
<text x="0" y="280" text-anchor="start"><tspan fill="#6b7785" font-size="11.5">module never imported</tspan></text>
<rect x="170" y="224" width="272" height="80" rx="8" fill="#fbeaea" stroke="#b03a2e" stroke-width="1.2"/>
<path d="M192 234 L204 255 H180 Z" fill="#b03a2e" stroke="#b03a2e" stroke-width="2" stroke-linejoin="round"/>
<path d="M192 241 V248 M192 251.5 V252" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
<text x="214" y="250" text-anchor="start"><tspan fill="#222" font-size="12">The event was marked as processed and</tspan></text>
<text x="214" y="265" text-anchor="start"><tspan fill="#222" font-size="12">its side effects were lost silently.</tspan></text>
<polyline points="446.0,264.0 460.0,264.0" fill="none" stroke="#2e7d32" stroke-width="2"/>
<polygon points="466,264.0 458.9,267.8 458.9,260.2" fill="#2e7d32"/>
<rect x="470" y="224" width="290" height="80" rx="8" fill="#e8f3e9" stroke="#2e7d32" stroke-width="1.2"/>
<circle cx="492" cy="246" r="12" fill="#2e7d32"/>
<path d="M486.5 246.5 l3.8 4 l7.5 -8.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="514" y="250" text-anchor="start"><tspan fill="#222" font-size="12">It stays pending and is retried with a</tspan></text>
<text x="514" y="265" text-anchor="start"><tspan fill="#222" font-size="12">critical log, then ends as failed, ready</tspan></text>
<text x="514" y="280" text-anchor="start"><tspan fill="#222" font-size="12">to replay.</tspan></text>
</g>
</svg>
