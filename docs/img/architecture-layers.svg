<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -3 766 402" width="766" height="402" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif">
<g class="arch-f2">
<text x="0" y="31.0" text-anchor="start"><tspan font-weight="bold" fill="#6b7785" font-size="12">Composition</tspan></text>
<rect x="150" y="0" width="290" height="54" rx="8" fill="#e8f0f8" stroke="#1f4e79" stroke-width="1.4"/>
<text x="295.0" y="22" text-anchor="middle"><tspan font-weight="bold" fill="#1f4e79" font-size="12.5">app.api.v1</tspan></text>
<text x="295.0" y="40" text-anchor="middle"><tspan fill="#6b7785" font-size="11">composes the context routers</tspan></text>
<rect x="470" y="0" width="290" height="54" rx="8" fill="#e8f0f8" stroke="#1f4e79" stroke-width="1.4"/>
<text x="615.0" y="22" text-anchor="middle"><tspan font-weight="bold" fill="#1f4e79" font-size="12.5">app.db_registry</tspan></text>
<text x="615.0" y="40" text-anchor="middle"><tspan fill="#6b7785" font-size="11">imports every model and handler</tspan></text>
<text x="0" y="119.0" text-anchor="start"><tspan font-weight="bold" fill="#6b7785" font-size="12">Contexts</tspan></text>
<rect x="150" y="88" width="250" height="54" rx="8" fill="#e8f0f8" stroke="#1f4e79" stroke-width="1.4"/>
<text x="275.0" y="110" text-anchor="middle"><tspan font-weight="bold" fill="#1f4e79" font-size="12.5">app.auth</tspan></text>
<text x="275.0" y="128" text-anchor="middle"><tspan fill="#6b7785" font-size="11">users, roles, tokens</tspan></text>
<rect x="510" y="88" width="250" height="54" rx="8" fill="#e8f0f8" stroke="#1f4e79" stroke-width="1.4"/>
<text x="635.0" y="110" text-anchor="middle"><tspan font-weight="bold" fill="#1f4e79" font-size="12.5">app.items</tspan></text>
<text x="635.0" y="128" text-anchor="middle"><tspan fill="#6b7785" font-size="11">example CRUD with events</tspan></text>
<line x1="400" y1="115.0" x2="510" y2="115.0" stroke="#b03a2e" stroke-width="1.2" stroke-dasharray="4 3"/>
<path d="M450.5 98.5 L459.5 107.5 M459.5 98.5 L450.5 107.5" stroke="#b03a2e" stroke-width="2.4" stroke-linecap="round"/>
<text x="455.0" y="131.0" text-anchor="middle" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="bold" fill="#b03a2e" font-size="11">no imports</tspan></text>
<text x="0" y="207.0" text-anchor="start"><tspan font-weight="bold" fill="#6b7785" font-size="12">Shared</tspan></text>
<rect x="150" y="176" width="610" height="54" rx="8" fill="#e8f0f8" stroke="#1f4e79" stroke-width="1.4"/>
<text x="455.0" y="198" text-anchor="middle"><tspan font-weight="bold" fill="#1f4e79" font-size="12.5">app.deps</tspan></text>
<text x="455.0" y="216" text-anchor="middle"><tspan fill="#6b7785" font-size="11">session, repositories, current user</tspan></text>
<text x="0" y="295.0" text-anchor="start"><tspan font-weight="bold" fill="#6b7785" font-size="12">Infrastructure</tspan></text>
<rect x="150" y="264" width="610" height="54" rx="8" fill="#e8f0f8" stroke="#1f4e79" stroke-width="1.4"/>
<text x="455.0" y="286" text-anchor="middle"><tspan font-weight="bold" fill="#1f4e79" font-size="12.5">app.core</tspan></text>
<text x="455.0" y="304" text-anchor="middle"><tspan fill="#6b7785" font-size="11">config, db, events, jobs, security, logging, metrics</tspan></text>
<polyline points="132.0,6.0 132.0,306.0" fill="none" stroke="#6b7785" stroke-width="2"/>
<polygon points="132,312 128.2,304.9 135.8,304.9" fill="#6b7785"/>
<rect x="0" y="340" width="760" height="56" rx="6" fill="#f2f5f9" stroke="#c9d3df" stroke-width="1"/>
<text x="14" y="363" text-anchor="start"><tspan fill="#222" font-size="12">Imports go down: a band may import any band below it, never one above. The one exception is app.deps.auth, which reads the user</tspan></text>
<text x="14" y="379" text-anchor="start"><tspan fill="#222" font-size="12">from app.auth to give every context its current user.</tspan></text>
</g>
</svg>
