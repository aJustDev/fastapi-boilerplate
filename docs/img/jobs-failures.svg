<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -3 766 212" width="766" height="212" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif">
<g class="jobs-f2">
<text x="306.0" y="20" text-anchor="middle"><tspan font-weight="bold" fill="#b03a2e" font-size="12">Before</tspan></text>
<text x="615.0" y="20" text-anchor="middle"><tspan font-weight="bold" fill="#2e7d32" font-size="12">Now</tspan></text>
<text x="0" y="58" text-anchor="start"><tspan font-weight="bold" fill="#222" font-size="13">Several workers</tspan></text>
<text x="0" y="75" text-anchor="start"><tspan fill="#6b7785" font-size="11.5">--workers N or replicas</tspan></text>
<rect x="170" y="34" width="272" height="80" rx="8" fill="#fbeaea" stroke="#b03a2e" stroke-width="1.2"/>
<path d="M192 44 L204 65 H180 Z" fill="#b03a2e" stroke="#b03a2e" stroke-width="2" stroke-linejoin="round"/>
<path d="M192 51 V58 M192 61.5 V62" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
<text x="214" y="60" text-anchor="start"><tspan fill="#222" font-size="12">Claiming the first job released the</tspan></text>
<text x="214" y="75" text-anchor="start"><tspan fill="#222" font-size="12">locks on the rest of the batch: two</tspan></text>
<text x="214" y="90" text-anchor="start"><tspan fill="#222" font-size="12">workers ran the same job.</tspan></text>
<polyline points="446.0,74.0 460.0,74.0" fill="none" stroke="#2e7d32" stroke-width="2"/>
<polygon points="466,74.0 458.9,77.8 458.9,70.2" fill="#2e7d32"/>
<rect x="470" y="34" width="290" height="80" rx="8" fill="#e8f3e9" stroke="#2e7d32" stroke-width="1.2"/>
<circle cx="492" cy="56" r="12" fill="#2e7d32"/>
<path d="M486.5 56.5 l3.8 4 l7.5 -8.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="514" y="60" text-anchor="start"><tspan fill="#222" font-size="12">Each job is claimed with a conditional</tspan></text>
<text x="514" y="75" text-anchor="start"><tspan fill="#222" font-size="12">update: one worker wins, the others skip</tspan></text>
<text x="514" y="90" text-anchor="start"><tspan fill="#222" font-size="12">it.</tspan></text>
<text x="0" y="150" text-anchor="start"><tspan font-weight="bold" fill="#222" font-size="13">A worker dies mid-job</tspan></text>
<text x="0" y="167" text-anchor="start"><tspan fill="#6b7785" font-size="11.5">OOM, SIGKILL, a deploy</tspan></text>
<rect x="170" y="126" width="272" height="80" rx="8" fill="#fbeaea" stroke="#b03a2e" stroke-width="1.2"/>
<path d="M192 136 L204 157 H180 Z" fill="#b03a2e" stroke="#b03a2e" stroke-width="2" stroke-linejoin="round"/>
<path d="M192 143 V150 M192 153.5 V154" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
<text x="214" y="152" text-anchor="start"><tspan fill="#222" font-size="12">Any worker starting up reset every</tspan></text>
<text x="214" y="167" text-anchor="start"><tspan fill="#222" font-size="12">running job, also the ones other</tspan></text>
<text x="214" y="182" text-anchor="start"><tspan fill="#222" font-size="12">workers were still running.</tspan></text>
<polyline points="446.0,166.0 460.0,166.0" fill="none" stroke="#2e7d32" stroke-width="2"/>
<polygon points="466,166.0 458.9,169.8 458.9,162.2" fill="#2e7d32"/>
<rect x="470" y="126" width="290" height="80" rx="8" fill="#e8f3e9" stroke="#2e7d32" stroke-width="1.2"/>
<circle cx="492" cy="148" r="12" fill="#2e7d32"/>
<path d="M486.5 148.5 l3.8 4 l7.5 -8.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="514" y="152" text-anchor="start"><tspan fill="#222" font-size="12">The job keeps its lease; once it</tspan></text>
<text x="514" y="167" text-anchor="start"><tspan fill="#222" font-size="12">expires, the next poll of any worker</tspan></text>
<text x="514" y="182" text-anchor="start"><tspan fill="#222" font-size="12">frees it.</tspan></text>
</g>
</svg>
