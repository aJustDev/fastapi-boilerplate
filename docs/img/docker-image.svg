<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -3 766 396" width="766" height="396" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif">
<g class="docker-f1">
<text x="306.0" y="20" text-anchor="middle"><tspan font-weight="bold" fill="#b03a2e" font-size="12">Before</tspan></text>
<text x="615.0" y="20" text-anchor="middle"><tspan font-weight="bold" fill="#2e7d32" font-size="12">Now</tspan></text>
<text x="0" y="58" text-anchor="start"><tspan font-weight="bold" fill="#222" font-size="13">Secrets in the build</tspan></text>
<text x="0" y="75" text-anchor="start"><tspan font-weight="bold" fill="#222" font-size="13">context</tspan></text>
<text x="0" y="92" text-anchor="start"><tspan fill="#6b7785" font-size="11.5">.env.local next to the code</tspan></text>
<rect x="170" y="34" width="272" height="80" rx="8" fill="#fbeaea" stroke="#b03a2e" stroke-width="1.2"/>
<path d="M192 44 L204 65 H180 Z" fill="#b03a2e" stroke="#b03a2e" stroke-width="2" stroke-linejoin="round"/>
<path d="M192 51 V58 M192 61.5 V62" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
<text x="214" y="60" text-anchor="start"><tspan fill="#222" font-size="12">COPY . . plus !.env.local in</tspan></text>
<text x="214" y="75" text-anchor="start"><tspan fill="#222" font-size="12">.dockerignore put the developer's</tspan></text>
<text x="214" y="90" text-anchor="start"><tspan fill="#222" font-size="12">secrets in the image.</tspan></text>
<polyline points="446.0,74.0 460.0,74.0" fill="none" stroke="#2e7d32" stroke-width="2"/>
<polygon points="466,74.0 458.9,77.8 458.9,70.2" fill="#2e7d32"/>
<rect x="470" y="34" width="290" height="80" rx="8" fill="#e8f3e9" stroke="#2e7d32" stroke-width="1.2"/>
<circle cx="492" cy="56" r="12" fill="#2e7d32"/>
<path d="M486.5 56.5 l3.8 4 l7.5 -8.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="514" y="60" text-anchor="start"><tspan fill="#222" font-size="12">Only main.py and app/ are copied, and no</tspan></text>
<text x="514" y="75" text-anchor="start"><tspan fill="#222" font-size="12">.env file enters the build context.</tspan></text>
<text x="0" y="150" text-anchor="start"><tspan font-weight="bold" fill="#222" font-size="13">A new file in the</tspan></text>
<text x="0" y="167" text-anchor="start"><tspan font-weight="bold" fill="#222" font-size="13">repo</tspan></text>
<text x="0" y="184" text-anchor="start"><tspan fill="#6b7785" font-size="11.5">tests, notes, scripts</tspan></text>
<rect x="170" y="126" width="272" height="80" rx="8" fill="#fbeaea" stroke="#b03a2e" stroke-width="1.2"/>
<path d="M192 136 L204 157 H180 Z" fill="#b03a2e" stroke="#b03a2e" stroke-width="2" stroke-linejoin="round"/>
<path d="M192 143 V150 M192 153.5 V154" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
<text x="214" y="152" text-anchor="start"><tspan fill="#222" font-size="12">It entered the image unless someone</tspan></text>
<text x="214" y="167" text-anchor="start"><tspan fill="#222" font-size="12">remembered to exclude it.</tspan></text>
<polyline points="446.0,166.0 460.0,166.0" fill="none" stroke="#2e7d32" stroke-width="2"/>
<polygon points="466,166.0 458.9,169.8 458.9,162.2" fill="#2e7d32"/>
<rect x="470" y="126" width="290" height="80" rx="8" fill="#e8f3e9" stroke="#2e7d32" stroke-width="1.2"/>
<circle cx="492" cy="148" r="12" fill="#2e7d32"/>
<path d="M486.5 148.5 l3.8 4 l7.5 -8.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="514" y="152" text-anchor="start"><tspan fill="#222" font-size="12">It stays out unless it is added to the</tspan></text>
<text x="514" y="167" text-anchor="start"><tspan fill="#222" font-size="12">COPY list, which a test checks.</tspan></text>
<text x="0" y="242" text-anchor="start"><tspan font-weight="bold" fill="#222" font-size="13">The app reports its</tspan></text>
<text x="0" y="259" text-anchor="start"><tspan font-weight="bold" fill="#222" font-size="13">version</tspan></text>
<text x="0" y="276" text-anchor="start"><tspan fill="#6b7785" font-size="11.5">APP_VERSION</tspan></text>
<rect x="170" y="218" width="272" height="80" rx="8" fill="#fbeaea" stroke="#b03a2e" stroke-width="1.2"/>
<path d="M192 228 L204 249 H180 Z" fill="#b03a2e" stroke="#b03a2e" stroke-width="2" stroke-linejoin="round"/>
<path d="M192 235 V242 M192 245.5 V246" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
<text x="214" y="244" text-anchor="start"><tspan fill="#222" font-size="12">Written twice, in pyproject.toml and</tspan></text>
<text x="214" y="259" text-anchor="start"><tspan fill="#222" font-size="12">config.py, free to drift apart.</tspan></text>
<polyline points="446.0,258.0 460.0,258.0" fill="none" stroke="#2e7d32" stroke-width="2"/>
<polygon points="466,258.0 458.9,261.8 458.9,254.2" fill="#2e7d32"/>
<rect x="470" y="218" width="290" height="80" rx="8" fill="#e8f3e9" stroke="#2e7d32" stroke-width="1.2"/>
<circle cx="492" cy="240" r="12" fill="#2e7d32"/>
<path d="M486.5 240.5 l3.8 4 l7.5 -8.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="514" y="244" text-anchor="start"><tspan fill="#222" font-size="12">Read from the installed package:</tspan></text>
<text x="514" y="259" text-anchor="start"><tspan fill="#222" font-size="12">pyproject.toml is the only place to bump</tspan></text>
<text x="514" y="274" text-anchor="start"><tspan fill="#222" font-size="12">it.</tspan></text>
<text x="0" y="334" text-anchor="start"><tspan font-weight="bold" fill="#222" font-size="13">Clock and tooling at</tspan></text>
<text x="0" y="351" text-anchor="start"><tspan font-weight="bold" fill="#222" font-size="13">runtime</tspan></text>
<text x="0" y="368" text-anchor="start"><tspan fill="#6b7785" font-size="11.5">time zone, package manager</tspan></text>
<rect x="170" y="310" width="272" height="80" rx="8" fill="#fbeaea" stroke="#b03a2e" stroke-width="1.2"/>
<path d="M192 320 L204 341 H180 Z" fill="#b03a2e" stroke="#b03a2e" stroke-width="2" stroke-linejoin="round"/>
<path d="M192 327 V334 M192 337.5 V338" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
<text x="214" y="336" text-anchor="start"><tspan fill="#222" font-size="12">TZ=Europe/Madrid and pip shipped in</tspan></text>
<text x="214" y="351" text-anchor="start"><tspan fill="#222" font-size="12">the image.</tspan></text>
<polyline points="446.0,350.0 460.0,350.0" fill="none" stroke="#2e7d32" stroke-width="2"/>
<polygon points="466,350.0 458.9,353.8 458.9,346.2" fill="#2e7d32"/>
<rect x="470" y="310" width="290" height="80" rx="8" fill="#e8f3e9" stroke="#2e7d32" stroke-width="1.2"/>
<circle cx="492" cy="332" r="12" fill="#2e7d32"/>
<path d="M486.5 332.5 l3.8 4 l7.5 -8.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="514" y="336" text-anchor="start"><tspan fill="#222" font-size="12">UTC, like CI; no pip, nothing gets</tspan></text>
<text x="514" y="351" text-anchor="start"><tspan fill="#222" font-size="12">installed at runtime.</tspan></text>
</g>
</svg>
