<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -3 766 398" width="766" height="398" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif">
<g class="err-f1">
<text x="306.0" y="20" text-anchor="middle"><tspan font-weight="bold" fill="#b03a2e" font-size="12">Before</tspan></text>
<text x="615.0" y="20" text-anchor="middle"><tspan font-weight="bold" fill="#2e7d32" font-size="12">Now</tspan></text>
<text x="0" y="58" text-anchor="start"><tspan font-weight="bold" fill="#222" font-size="13">Two requests insert</tspan></text>
<text x="0" y="75" text-anchor="start"><tspan font-weight="bold" fill="#222" font-size="13">the same row</tspan></text>
<text x="0" y="92" text-anchor="start"><tspan fill="#6b7785" font-size="11.5">a race past the service</tspan></text>
<text x="0" y="107" text-anchor="start"><tspan fill="#6b7785" font-size="11.5">check</tspan></text>
<rect x="170" y="34" width="272" height="82" rx="8" fill="#fbeaea" stroke="#b03a2e" stroke-width="1.2"/>
<path d="M192 44 L204 65 H180 Z" fill="#b03a2e" stroke="#b03a2e" stroke-width="2" stroke-linejoin="round"/>
<path d="M192 51 V58 M192 61.5 V62" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
<text x="214" y="60" text-anchor="start"><tspan fill="#222" font-size="12">The IntegrityError reached the</tspan></text>
<text x="214" y="75" text-anchor="start"><tspan fill="#222" font-size="12">catch-all: 500 and an alert for a</tspan></text>
<text x="214" y="90" text-anchor="start"><tspan fill="#222" font-size="12">duplicate.</tspan></text>
<polyline points="446.0,75.0 460.0,75.0" fill="none" stroke="#2e7d32" stroke-width="2"/>
<polygon points="466,75.0 458.9,78.8 458.9,71.2" fill="#2e7d32"/>
<rect x="470" y="34" width="290" height="82" rx="8" fill="#e8f3e9" stroke="#2e7d32" stroke-width="1.2"/>
<circle cx="492" cy="56" r="12" fill="#2e7d32"/>
<path d="M486.5 56.5 l3.8 4 l7.5 -8.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="514" y="60" text-anchor="start"><tspan fill="#222" font-size="12">409 with code integrity_conflict: the</tspan></text>
<text x="514" y="75" text-anchor="start"><tspan fill="#222" font-size="12">client can retry or show a message.</tspan></text>
<text x="0" y="152" text-anchor="start"><tspan font-weight="bold" fill="#222" font-size="13">A route that does not</tspan></text>
<text x="0" y="169" text-anchor="start"><tspan font-weight="bold" fill="#222" font-size="13">exist</tspan></text>
<text x="0" y="186" text-anchor="start"><tspan fill="#6b7785" font-size="11.5">typo, old client</tspan></text>
<rect x="170" y="128" width="272" height="80" rx="8" fill="#fbeaea" stroke="#b03a2e" stroke-width="1.2"/>
<path d="M192 138 L204 159 H180 Z" fill="#b03a2e" stroke="#b03a2e" stroke-width="2" stroke-linejoin="round"/>
<path d="M192 145 V152 M192 155.5 V156" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
<text x="214" y="154" text-anchor="start"><tspan fill="#222" font-size="12">FastAPI's own body without a code,</tspan></text>
<text x="214" y="169" text-anchor="start"><tspan fill="#222" font-size="12">unlike every other error.</tspan></text>
<polyline points="446.0,168.0 460.0,168.0" fill="none" stroke="#2e7d32" stroke-width="2"/>
<polygon points="466,168.0 458.9,171.8 458.9,164.2" fill="#2e7d32"/>
<rect x="470" y="128" width="290" height="80" rx="8" fill="#e8f3e9" stroke="#2e7d32" stroke-width="1.2"/>
<circle cx="492" cy="150" r="12" fill="#2e7d32"/>
<path d="M486.5 150.5 l3.8 4 l7.5 -8.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="514" y="154" text-anchor="start"><tspan fill="#222" font-size="12">404 with code not_found, the same as a</tspan></text>
<text x="514" y="169" text-anchor="start"><tspan fill="#222" font-size="12">missing resource.</tspan></text>
<text x="0" y="244" text-anchor="start"><tspan font-weight="bold" fill="#222" font-size="13">Too many requests</tspan></text>
<text x="0" y="261" text-anchor="start"><tspan fill="#6b7785" font-size="11.5">a limit is hit</tspan></text>
<rect x="170" y="220" width="272" height="80" rx="8" fill="#fbeaea" stroke="#b03a2e" stroke-width="1.2"/>
<path d="M192 230 L204 251 H180 Z" fill="#b03a2e" stroke="#b03a2e" stroke-width="2" stroke-linejoin="round"/>
<path d="M192 237 V244 M192 247.5 V248" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
<text x="214" y="246" text-anchor="start"><tspan fill="#222" font-size="12">Retry-After held the word 'minute'</tspan></text>
<text x="214" y="261" text-anchor="start"><tspan fill="#222" font-size="12">instead of a number.</tspan></text>
<polyline points="446.0,260.0 460.0,260.0" fill="none" stroke="#2e7d32" stroke-width="2"/>
<polygon points="466,260.0 458.9,263.8 458.9,256.2" fill="#2e7d32"/>
<rect x="470" y="220" width="290" height="80" rx="8" fill="#e8f3e9" stroke="#2e7d32" stroke-width="1.2"/>
<circle cx="492" cy="242" r="12" fill="#2e7d32"/>
<path d="M486.5 242.5 l3.8 4 l7.5 -8.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="514" y="246" text-anchor="start"><tspan fill="#222" font-size="12">429, code rate_limited, Retry-After in</tspan></text>
<text x="514" y="261" text-anchor="start"><tspan fill="#222" font-size="12">seconds until the window opens.</tspan></text>
<text x="0" y="336" text-anchor="start"><tspan font-weight="bold" fill="#222" font-size="13">Any error, in OpenAPI</tspan></text>
<text x="0" y="353" text-anchor="start"><tspan fill="#6b7785" font-size="11.5">generated clients</tspan></text>
<rect x="170" y="312" width="272" height="80" rx="8" fill="#fbeaea" stroke="#b03a2e" stroke-width="1.2"/>
<path d="M192 322 L204 343 H180 Z" fill="#b03a2e" stroke="#b03a2e" stroke-width="2" stroke-linejoin="round"/>
<path d="M192 329 V336 M192 339.5 V340" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
<text x="214" y="338" text-anchor="start"><tspan fill="#222" font-size="12">The schema showed FastAPI's</tspan></text>
<text x="214" y="353" text-anchor="start"><tspan fill="#222" font-size="12">validation error, not what the API</tspan></text>
<text x="214" y="368" text-anchor="start"><tspan fill="#222" font-size="12">sent.</tspan></text>
<polyline points="446.0,352.0 460.0,352.0" fill="none" stroke="#2e7d32" stroke-width="2"/>
<polygon points="466,352.0 458.9,355.8 458.9,348.2" fill="#2e7d32"/>
<rect x="470" y="312" width="290" height="80" rx="8" fill="#e8f3e9" stroke="#2e7d32" stroke-width="1.2"/>
<circle cx="492" cy="334" r="12" fill="#2e7d32"/>
<path d="M486.5 334.5 l3.8 4 l7.5 -8.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="514" y="338" text-anchor="start"><tspan fill="#222" font-size="12">ErrorResponse and</tspan></text>
<text x="514" y="353" text-anchor="start"><tspan fill="#222" font-size="12">ValidationErrorResponse, checked by a</tspan></text>
<text x="514" y="368" text-anchor="start"><tspan fill="#222" font-size="12">test.</tspan></text>
</g>
</svg>
