<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -3 766 398" width="766" height="398" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif">
<g class="auth-f2">
<text x="306.0" y="20" text-anchor="middle"><tspan font-weight="bold" fill="#b03a2e" font-size="12">Before</tspan></text>
<text x="615.0" y="20" text-anchor="middle"><tspan font-weight="bold" fill="#2e7d32" font-size="12">Now</tspan></text>
<text x="0" y="58" text-anchor="start"><tspan font-weight="bold" fill="#222" font-size="13">A refresh token is</tspan></text>
<text x="0" y="75" text-anchor="start"><tspan font-weight="bold" fill="#222" font-size="13">stolen</tspan></text>
<text x="0" y="92" text-anchor="start"><tspan fill="#6b7785" font-size="11.5">a leaked log, a compromised</tspan></text>
<text x="0" y="107" text-anchor="start"><tspan fill="#6b7785" font-size="11.5">device</tspan></text>
<rect x="170" y="34" width="272" height="82" rx="8" fill="#fbeaea" stroke="#b03a2e" stroke-width="1.2"/>
<path d="M192 44 L204 65 H180 Z" fill="#b03a2e" stroke="#b03a2e" stroke-width="2" stroke-linejoin="round"/>
<path d="M192 51 V58 M192 61.5 V62" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
<text x="214" y="60" text-anchor="start"><tspan fill="#222" font-size="12">Thief and user could both refresh for</tspan></text>
<text x="214" y="75" text-anchor="start"><tspan fill="#222" font-size="12">7 days; nothing noticed the second</tspan></text>
<text x="214" y="90" text-anchor="start"><tspan fill="#222" font-size="12">copy.</tspan></text>
<polyline points="446.0,75.0 460.0,75.0" fill="none" stroke="#2e7d32" stroke-width="2"/>
<polygon points="466,75.0 458.9,78.8 458.9,71.2" fill="#2e7d32"/>
<rect x="470" y="34" width="290" height="82" rx="8" fill="#e8f3e9" stroke="#2e7d32" stroke-width="1.2"/>
<circle cx="492" cy="56" r="12" fill="#2e7d32"/>
<path d="M486.5 56.5 l3.8 4 l7.5 -8.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="514" y="60" text-anchor="start"><tspan fill="#222" font-size="12">Its first use rotates it; when the other</tspan></text>
<text x="514" y="75" text-anchor="start"><tspan fill="#222" font-size="12">copy comes back, every session of the</tspan></text>
<text x="514" y="90" text-anchor="start"><tspan fill="#222" font-size="12">user ends.</tspan></text>
<text x="0" y="152" text-anchor="start"><tspan font-weight="bold" fill="#222" font-size="13">The user logs out</tspan></text>
<text x="0" y="169" text-anchor="start"><tspan fill="#6b7785" font-size="11.5">explicit logout</tspan></text>
<rect x="170" y="128" width="272" height="80" rx="8" fill="#fbeaea" stroke="#b03a2e" stroke-width="1.2"/>
<path d="M192 138 L204 159 H180 Z" fill="#b03a2e" stroke="#b03a2e" stroke-width="2" stroke-linejoin="round"/>
<path d="M192 145 V152 M192 155.5 V156" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
<text x="214" y="154" text-anchor="start"><tspan fill="#222" font-size="12">Only the access token was revoked:</tspan></text>
<text x="214" y="169" text-anchor="start"><tspan fill="#222" font-size="12">the refresh token kept opening new</tspan></text>
<text x="214" y="184" text-anchor="start"><tspan fill="#222" font-size="12">sessions.</tspan></text>
<polyline points="446.0,168.0 460.0,168.0" fill="none" stroke="#2e7d32" stroke-width="2"/>
<polygon points="466,168.0 458.9,171.8 458.9,164.2" fill="#2e7d32"/>
<rect x="470" y="128" width="290" height="80" rx="8" fill="#e8f3e9" stroke="#2e7d32" stroke-width="1.2"/>
<circle cx="492" cy="150" r="12" fill="#2e7d32"/>
<path d="M486.5 150.5 l3.8 4 l7.5 -8.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="514" y="154" text-anchor="start"><tspan fill="#222" font-size="12">The refresh token sent with the logout</tspan></text>
<text x="514" y="169" text-anchor="start"><tspan fill="#222" font-size="12">is revoked too.</tspan></text>
<text x="0" y="244" text-anchor="start"><tspan font-weight="bold" fill="#222" font-size="13">Login with an unknown</tspan></text>
<text x="0" y="261" text-anchor="start"><tspan font-weight="bold" fill="#222" font-size="13">account</tspan></text>
<text x="0" y="278" text-anchor="start"><tspan fill="#6b7785" font-size="11.5">probing which emails exist</tspan></text>
<rect x="170" y="220" width="272" height="80" rx="8" fill="#fbeaea" stroke="#b03a2e" stroke-width="1.2"/>
<path d="M192 230 L204 251 H180 Z" fill="#b03a2e" stroke="#b03a2e" stroke-width="2" stroke-linejoin="round"/>
<path d="M192 237 V244 M192 247.5 V248" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
<text x="214" y="246" text-anchor="start"><tspan fill="#222" font-size="12">It answered faster than a wrong</tspan></text>
<text x="214" y="261" text-anchor="start"><tspan fill="#222" font-size="12">password, so timing revealed which</tspan></text>
<text x="214" y="276" text-anchor="start"><tspan fill="#222" font-size="12">accounts exist.</tspan></text>
<polyline points="446.0,260.0 460.0,260.0" fill="none" stroke="#2e7d32" stroke-width="2"/>
<polygon points="466,260.0 458.9,263.8 458.9,256.2" fill="#2e7d32"/>
<rect x="470" y="220" width="290" height="80" rx="8" fill="#e8f3e9" stroke="#2e7d32" stroke-width="1.2"/>
<circle cx="492" cy="242" r="12" fill="#2e7d32"/>
<path d="M486.5 242.5 l3.8 4 l7.5 -8.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="514" y="246" text-anchor="start"><tspan fill="#222" font-size="12">It runs the same password check against</tspan></text>
<text x="514" y="261" text-anchor="start"><tspan fill="#222" font-size="12">a dummy hash: both answers take as long.</tspan></text>
<text x="0" y="336" text-anchor="start"><tspan font-weight="bold" fill="#222" font-size="13">Email in another case</tspan></text>
<text x="0" y="353" text-anchor="start"><tspan fill="#6b7785" font-size="11.5">Foo@x.com and foo@x.com</tspan></text>
<rect x="170" y="312" width="272" height="80" rx="8" fill="#fbeaea" stroke="#b03a2e" stroke-width="1.2"/>
<path d="M192 322 L204 343 H180 Z" fill="#b03a2e" stroke="#b03a2e" stroke-width="2" stroke-linejoin="round"/>
<path d="M192 329 V336 M192 339.5 V340" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
<text x="214" y="338" text-anchor="start"><tspan fill="#222" font-size="12">Login failed, and registering it</tspan></text>
<text x="214" y="353" text-anchor="start"><tspan fill="#222" font-size="12">again crashed with a 500.</tspan></text>
<polyline points="446.0,352.0 460.0,352.0" fill="none" stroke="#2e7d32" stroke-width="2"/>
<polygon points="466,352.0 458.9,355.8 458.9,348.2" fill="#2e7d32"/>
<rect x="470" y="312" width="290" height="80" rx="8" fill="#e8f3e9" stroke="#2e7d32" stroke-width="1.2"/>
<circle cx="492" cy="334" r="12" fill="#2e7d32"/>
<path d="M486.5 334.5 l3.8 4 l7.5 -8.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="514" y="338" text-anchor="start"><tspan fill="#222" font-size="12">Lookups ignore case like the unique</tspan></text>
<text x="514" y="353" text-anchor="start"><tspan fill="#222" font-size="12">index; a duplicate registration is a</tspan></text>
<text x="514" y="368" text-anchor="start"><tspan fill="#222" font-size="12">409.</tspan></text>
</g>
</svg>
