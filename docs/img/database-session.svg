<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -3 766 324" width="766" height="324" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif">
<g class="db-f1">
<rect x="40" y="0" width="320" height="46" rx="8" fill="#e8f0f8" stroke="#1f4e79" stroke-width="1.4"/>
<text x="200.0" y="19" text-anchor="middle"><tspan font-weight="bold" fill="#1f4e79" font-size="12.5">1 - A request asks for a repository</tspan></text>
<text x="200.0" y="36" text-anchor="middle"><tspan fill="#6b7785" font-size="11">get_session opens one session for the request</tspan></text>
<polyline points="200.0,46.0 200.0,60.0" fill="none" stroke="#6b7785" stroke-width="1.6"/>
<polygon points="200.0,66 196.2,58.9 203.8,58.9" fill="#6b7785"/>
<rect x="40" y="66" width="320" height="46" rx="8" fill="#e8f0f8" stroke="#1f4e79" stroke-width="1.4"/>
<text x="200.0" y="85" text-anchor="middle"><tspan font-weight="bold" fill="#1f4e79" font-size="12.5">2 - Use cases and repos change data</tspan></text>
<text x="200.0" y="102" text-anchor="middle"><tspan fill="#6b7785" font-size="11">repos flush, they never commit</tspan></text>
<polyline points="200.0,112.0 200.0,126.0" fill="none" stroke="#6b7785" stroke-width="1.6"/>
<polygon points="200.0,132 196.2,124.9 203.8,124.9" fill="#6b7785"/>
<rect x="40" y="132" width="320" height="46" rx="22" fill="#fff3dc" stroke="#a35f00" stroke-width="1.4"/>
<text x="200.0" y="160" text-anchor="middle"><tspan font-weight="bold" fill="#a35f00" font-size="12.5">3 - Did the endpoint raise?</tspan></text>
<polyline points="360.0,155.0 434.0,155.0" fill="none" stroke="#b03a2e" stroke-width="1.6"/>
<polygon points="440,155.0 432.9,158.8 432.9,151.2" fill="#b03a2e"/>
<text x="400.0" y="149.0" text-anchor="middle"><tspan font-weight="bold" fill="#b03a2e" font-size="11">yes</tspan></text>
<rect x="440" y="132" width="320" height="46" rx="6" fill="#fbeaea" stroke="#b03a2e" stroke-width="1.2"/>
<text x="452" y="151" text-anchor="start"><tspan fill="#222" font-size="11.5">Rollback: nothing of this request is stored,</tspan></text>
<text x="452" y="165" text-anchor="start"><tspan fill="#222" font-size="11.5">published events included.</tspan></text>
<polyline points="200.0,178.0 200.0,192.0" fill="none" stroke="#6b7785" stroke-width="1.6"/>
<polygon points="200.0,198 196.2,190.9 203.8,190.9" fill="#6b7785"/>
<text x="208.0" y="192" text-anchor="start"><tspan font-weight="bold" fill="#6b7785" font-size="11">no</tspan></text>
<rect x="40" y="198" width="320" height="46" rx="8" fill="#e8f3e9" stroke="#2e7d32" stroke-width="1.4"/>
<text x="200.0" y="217" text-anchor="middle"><tspan font-weight="bold" fill="#2e7d32" font-size="12.5">4 - Commit, then the response is sent</tspan></text>
<text x="200.0" y="234" text-anchor="middle"><tspan fill="#6b7785" font-size="11">every change and event of the request, or none</tspan></text>
<rect x="0" y="266" width="760" height="52" rx="6" fill="#f2f5f9" stroke="#c9d3df" stroke-width="1"/>
<text x="14" y="289" text-anchor="start"><tspan fill="#222" font-size="12">Work that must survive a failed request (ending sessions after a stolen refresh token) opens its own session with</tspan></text>
<text x="14" y="305" text-anchor="start"><tspan fill="#222" font-size="12">async_session_factory and commits it.</tspan></text>
</g>
</svg>
