services:
  db:
    image: postgres:18-alpine
    env_file: .env.${ENVIRONMENT:-local}
    # One source for the credentials: the env file the API reads (DB_USER, DB_PASSWORD,
    # DB_NAME). The image wants them as POSTGRES_*, so they are mapped here inside the
    # container instead of being interpolated by compose, which reads the shell and a bare
    # .env but not this file.
    entrypoint:
      - sh
      - -c
      - >-
        export POSTGRES_USER="$$DB_USER" POSTGRES_PASSWORD="$$DB_PASSWORD" POSTGRES_DB="$$DB_NAME";
        exec docker-entrypoint.sh postgres
    environment:
      # The postgres:18 image moved its default data directory; pinning it keeps the
      # volume layout explicit.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Loopback only: a development database with development credentials. The host port
      # is not read from the env file: keep it equal to DB_PORT there.
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - pgdata18:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$DB_USER -d $$DB_NAME"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Applies the migrations and exits. The API starts only if it succeeded: migrations
  # never run inside the app lifespan, where N workers would race to apply them.
  migrate:
    build: .
    env_file: .env.${ENVIRONMENT:-local}
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    restart: "no"

  api:
    build: .
    env_file: .env.${ENVIRONMENT:-local}
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - .:/app
    command: ["main:app", "--host", "0.0.0.0", "--port", "8000", "--no-server-header", "--no-proxy-headers", "--reload", "--reload-dir", "app"]

# New name for PostgreSQL 18: a volume initialized by PostgreSQL 16 cannot be reused.
volumes:
  pgdata18:
