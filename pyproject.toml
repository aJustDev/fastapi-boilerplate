[project]
name = "app"
version = "0.1.0"
description = "FastAPI boilerplate"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162",
    "uvicorn[standard]>=0.54",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.32",
    "anyio>=4.16",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pyjwt>=2.15",
    "argon2-cffi>=25.1",
    "httpx>=0.28",
    "colorlog>=6.12",
    "slowapi>=0.1.10",
    "prometheus-client>=0.26",
    "alembic>=1.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--strict-markers"]
# pytest applies the last matching filter: the blanket ignore goes first so that
# deprecations raised from our own code (app, tests) still fail the run.
filterwarnings = [
    "ignore::DeprecationWarning",
    "error::DeprecationWarning:app",
    "error::DeprecationWarning:tests",
]
markers = [
    "integration: tests requiring real PostgreSQL via testcontainers",
]

[tool.ruff]
target-version = "py314"
line-length = 100
# Vendored Claude Code skills are not project code. force-exclude makes the pre-commit
# hooks, which pass file names explicitly, honor the exclusion too.
extend-exclude = [".claude"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    # An `except Exception` that neither re-raises nor logs the traceback hides the
    # failure. The rule exempts the ones that do, so a `noqa` here is a written decision.
    "BLE",  # flake8-blind-except
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "G",    # flake8-logging-format
    "S",    # flake8-bandit (security)
    "TID251",  # flake8-tidy-imports: banned-api only (see the block below)
]
ignore = [
    "E501",   # line too long
    "N818",   # DomainException naming convention (intentional)
    "B008",   # Depends() in default args (FastAPI pattern)
    # SQLAlchemy ORM resolves `Mapped[T]` and forward refs at runtime: quoting
    # annotations or moving imports under TYPE_CHECKING breaks column/relationship
    # inference.
    "UP037",  # quoted annotations
    "F821",   # forward refs in strings
    "TC001",  # move first-party import into TYPE_CHECKING
    "TC002",  # move third-party import into TYPE_CHECKING
    "TC003",  # move stdlib import into TYPE_CHECKING
]

[tool.ruff.lint.per-file-ignores]
# pytest uses assert; fixtures use literal passwords and tokens.
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# The test HTTP client is httpx.AsyncClient + ASGITransport everywhere. TestClient runs
# the app in another thread with its own event loop, which breaks async fixtures.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fastapi.testclient".msg = "Use httpx.AsyncClient + ASGITransport (docs/testing.md)."
"starlette.testclient".msg = "Use httpx.AsyncClient + ASGITransport (docs/testing.md)."

[tool.mypy]
python_version = "3.14"
disallow_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
enable_error_code = ["ignore-without-code"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["slowapi.*", "prometheus_client.*", "colorlog.*", "asyncpg.*", "testcontainers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
# FastAPI derives response types from response_model; annotating every route return
# adds noise without catching bugs.
module = ["app.api.*"]
disallow_untyped_defs = false

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "testcontainers[postgres]>=4.15",
    "pre-commit>=4.7",
    "mypy>=2.4",
    "pip-audit>=2.10",
]
